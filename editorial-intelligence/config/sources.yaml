# Source Registry (section VI — Source Policy).
#
# This is the single source of truth for which named sources exist and
# which tier they belong to. Providers reference a source purely by
# `name` (see models/source.py); nothing about tiering is hardcoded in
# Python. Adding a source is a data change here, not a code change.
#
# Explicitly NOT allowed anywhere in this system: scraping an arbitrary
# website, or trusting an unverified account. Every entry below is either
# an artist/org's own verified channel (tier_1), known Vietnamese
# hip-hop trade press / labels / festival organizers (tier_2), or a
# general but still-verifiable platform release feed (tier_3).

tier_1:
  - name: "Official Artist"
    description: "Nghệ sĩ tự đăng trên kênh chính thức của chính họ (không qua trung gian)."
