# Editorial Source Registry — configuration data only.
#
# This file describes editorial sources. It is NOT read by the Worker
# yet (see this directory's README.md) — it exists purely to separate
# editorial configuration from the collector engine (src/collectors/),
# which today still owns its own copy of this same roster in
# workers/editorial-os/src/collectors/sources.ts. Integrating the two
# (making the Worker read this file instead of / in addition to that
# TypeScript table) is explicitly deferred to a later PR.
#
# `rss` and `youtube` are nullable. No URL in this file has been
# guessed or fabricated: every one of the 20 sources below was audited
# (see the Phase 8.1 "Editorial Source Audit Report") and could not be
# verified from this environment — outbound network access to any
# public site is blocked at the network-policy level in this sandbox
# (confirmed against unrelated control targets, not just these sites),
# so `homepage`, `rss`, and `youtube` are `null` and `status` is
# "unknown" for every entry until a real, verifiable URL is supplied.
#
# Field reference (see README.md for the full schema doc):
#   id          - stable kebab-case identifier, matches src/collectors/sources.ts's id
#   name        - display name of the outlet, label, artist, or channel
#   category    - one of: international | vietnam | youtube | community
#   homepage    - official website URL, or null if unverified
#   rss         - official RSS feed URL, or null if unverified/not applicable
#   youtube     - official YouTube uploads Atom feed URL
#                 (https://www.youtube.com/feeds/videos.xml?channel_id=...),
#                 or null if unverified/not applicable
#   enabled     - whether this source is intended to be active once configured
#   status      - one of: supported | not_supported | unknown
#   verified    - true only once a human/tooling has actually confirmed a live feed
#   verifiedAt  - ISO 8601 timestamp of that verification, or null
#   notes       - human-readable explanation, always required when unverified

