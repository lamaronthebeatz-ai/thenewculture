name: Build TNC site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # V3.0 Promotion System: chiến dịch quảng bá tự bật/tắt theo Ngày bắt
  # đầu/Ngày kết thúc, nhưng site tĩnh chỉ cập nhật khi build chạy — nếu
  # không ai push code đúng ngày đó, banner sẽ trễ. Chạy build hằng ngày
  # để ngày hết hạn có hiệu lực mà không cần thao tác gì thêm. 17:00 UTC
  # ~ 00:00 giờ Việt Nam (UTC+7). Không tạo commit/thay đổi gì nếu output
  # không đổi (xem bước cuối bên dưới).
  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown
      - run: python scripts/build.py
      - run: |
          git config user.name "TNC Build Bot"
          git config user.email "bot@thenewculture.local"
          # "content" phải được add cùng "public": khi một bài viết thiếu
          # date, build.py chỉ gán ngày publish MỘT LẦN DUY NHẤT rồi ghi
          # thẳng vào content/articles/*.md để bất biến từ đó về sau (xem
          # _assign_date_once trong scripts/build.py). Nếu bước này chỉ add
          # "public", lần ghi đó không bao giờ được commit -> mỗi lần CI
          # build lại, bài viết đó bị coi là "vẫn thiếu date" và ngày publish
          # tiếp tục trôi theo đúng ngày build, phá vỡ tính bất biến.
          git add public content
          if git diff --staged --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Auto build [skip ci]"
            git push
          fi
