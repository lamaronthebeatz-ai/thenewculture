name: Build TNC site

on:
  push:
    branches: [main]
    # Bot tự commit lại "Auto build ..." mỗi lần build ra nội dung mới, và
    # commit đó CHỈ đụng tới public/ (xem bước git add cuối file). Trước đây
    # chặn vòng lặp bằng cách gắn "[skip ci]" vào message — nhưng Cloudflare
    # Pages Git integration cũng đọc đúng tag "[skip ci]"/"[CI Skip]" trong
    # commit message để QUYẾT ĐỊNH BỎ QUA DEPLOY (xem docs Cloudflare Pages,
    # mục Git integration) — nghĩa là mọi bài viết mới do chính pipeline này
    # build ra có nguy cơ không bao giờ được Cloudflare deploy lên production,
    # dù GitHub Actions báo "success" và commit đúng nội dung. paths-ignore
    # ở đây thay thế "[skip ci]" để chặn vòng lặp NGAY TỪ PHÍA GITHUB, cho
    # phép bỏ hẳn tag khỏi commit message — Cloudflare Pages sẽ deploy mọi
    # commit "Auto build" như bình thường.
    paths-ignore:
      - "public/**"
  workflow_dispatch:
  # Phase 2A — Automated Publishing Pipeline: Supabase Database Webhook (khi
  # articles.status chuyển sang 'published') -> Supabase Edge Function
  # (supabase/functions/on-article-published/) lọc đúng điều kiện rồi gọi
  # GitHub API "Create a repository dispatch event" với event_type dưới đây
  # -> kích hoạt đúng job build này, không cần ai commit/push/bấm rebuild
  # thủ công. Không đổi build engine — vẫn cùng 1 job "build" y hệt push/
  # cron/workflow_dispatch, chỉ thêm 1 cách kích hoạt mới.
  #
  # "cms-config-changed": bug fix — các bảng CMS V2 (site_settings, menus,
  # footer_settings, hero_slots, ads, promotions, announcements... Phase
  # 1-4) không có Database Webhook riêng như articles, nên sửa dữ liệu ở
  # các module này không tự kích hoạt build (Announcement thêm xong không
  # lên site, Cloudflare không thấy deploy mới). Event này được nút
  # "Rebuild site now" trong Dashboard gọi thủ công (xem supabase/functions/
  # trigger-rebuild/), cho editor chủ động build ngay không cần chờ cron.
  repository_dispatch:
    types: [article-published, cms-config-changed]
  # V3.0 Promotion System: chiến dịch quảng bá tự bật/tắt theo Ngày bắt
  # đầu/Ngày kết thúc, nhưng site tĩnh chỉ cập nhật khi build chạy — nếu
  # không ai push code đúng ngày đó, banner sẽ trễ. Rút ngắn từ hằng ngày
  # xuống mỗi 15 phút (bug fix cùng đợt với "cms-config-changed" ở trên) —
  # đây là LƯỚI AN TOÀN chung cho MỌI bảng CMS V2 hiện tại và sau này
  # (Site Settings/Menu/Footer/Hero/Ads/Promotion/Announcement...), không
  # cần thêm Database Webhook riêng cho từng bảng mới. Không tạo commit/
  # thay đổi gì nếu output không đổi (xem bước cuối bên dưới), nên các lần
  # chạy không có gì mới chỉ tốn ~1 phút CI, không deploy thêm gì.
  schedule:
    - cron: "*/15 * * * *"

# Mỗi lần lưu trong CMS (mỗi entry, kể cả sửa liên tiếp trong vài phút) đều
# push thẳng vào "main" -> kích hoạt 1 run riêng. Không có "concurrency" thì
# các run xếp hàng độc lập, không đảm bảo chạy/hoàn tất theo đúng thứ tự —
# quan sát thực tế: run của 1 commit cũ có thể kẹt "queued" phía sau run của
# commit MỚI HƠN đã build xong, khiến CMS "trông như" không cập nhật dù bản
# build mới nhất đã đúng. Vì build.py luôn đọc lại TOÀN BỘ content hiện có
# (không build theo diff), run nào cũ hơn commit hiện tại của "main" cũng vô
# nghĩa — hủy thẳng, chỉ giữ lại run ứng với commit mới nhất.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown
      - run: python scripts/build.py
        env:
          # articles/series/authors/tags giờ đọc trực tiếp từ Supabase (xem
          # load_articles()/load_series()/load_editors() trong scripts/
          # build.py) thay vì content/articles/*.md + content/editors/*.md.
          # Thiếu 2 biến này, build.py raise lỗi rõ ràng ngay khi gọi
          # Supabase thay vì âm thầm build ra site rỗng/lỗi.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: |
          git config user.name "TNC Build Bot"
          git config user.email "bot@thenewculture.local"
          # build.py không còn ghi ngược vào content/ (bài viết/tác giả giờ
          # sống trên Supabase, không phải file .md tự cập nhật ngày publish
          # nữa) — chỉ "public" (output tĩnh) có thể đổi sau mỗi lần build.
          git add public
          if git diff --staged --quiet; then
            echo "Khong co thay doi."
          else
            # KHÔNG được chứa "[skip ci]"/"[CI Skip]" — Cloudflare Pages Git
            # integration cũng dùng đúng tag này để bỏ qua deploy (xem
            # paths-ignore ở trigger push phía trên, đã thay thế vai trò
            # chặn vòng lặp của tag này cho GitHub Actions).
            git commit -m "Auto build: cap nhat public/ tu Supabase"
            git push
          fi
