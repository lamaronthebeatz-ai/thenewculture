name: Build TNC site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # V3.0 Promotion System: chiến dịch quảng bá tự bật/tắt theo Ngày bắt
  # đầu/Ngày kết thúc, nhưng site tĩnh chỉ cập nhật khi build chạy — nếu
  # không ai push code đúng ngày đó, banner sẽ trễ. Chạy build hằng ngày
  # để ngày hết hạn có hiệu lực mà không cần thao tác gì thêm. 17:00 UTC
  # ~ 00:00 giờ Việt Nam (UTC+7). Không tạo commit/thay đổi gì nếu output
  # không đổi (xem bước cuối bên dưới).
  schedule:
    - cron: "0 17 * * *"

# Mỗi lần lưu trong CMS (mỗi entry, kể cả sửa liên tiếp trong vài phút) đều
# push thẳng vào "main" -> kích hoạt 1 run riêng. Không có "concurrency" thì
# các run xếp hàng độc lập, không đảm bảo chạy/hoàn tất theo đúng thứ tự —
# quan sát thực tế: run của 1 commit cũ có thể kẹt "queued" phía sau run của
# commit MỚI HƠN đã build xong, khiến CMS "trông như" không cập nhật dù bản
# build mới nhất đã đúng. Vì build.py luôn đọc lại TOÀN BỘ content hiện có
# (không build theo diff), run nào cũ hơn commit hiện tại của "main" cũng vô
# nghĩa — hủy thẳng, chỉ giữ lại run ứng với commit mới nhất.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown
      - run: python scripts/build.py
        env:
          # articles/series/authors/tags giờ đọc trực tiếp từ Supabase (xem
          # load_articles()/load_series()/load_editors() trong scripts/
          # build.py) thay vì content/articles/*.md + content/editors/*.md.
          # Thiếu 2 biến này, build.py raise lỗi rõ ràng ngay khi gọi
          # Supabase thay vì âm thầm build ra site rỗng/lỗi.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: |
          git config user.name "TNC Build Bot"
          git config user.email "bot@thenewculture.local"
          # build.py không còn ghi ngược vào content/ (bài viết/tác giả giờ
          # sống trên Supabase, không phải file .md tự cập nhật ngày publish
          # nữa) — chỉ "public" (output tĩnh) có thể đổi sau mỗi lần build.
          git add public
          if git diff --staged --quiet; then
            echo "Khong co thay doi."
          else
            git commit -m "Auto build [skip ci]"
            git push
          fi
