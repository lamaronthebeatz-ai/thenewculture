# ============================================================
# CẤU HÌNH SVELTIA CMS — The New Culture
# ============================================================

backend:
  name: github
  repo: lamaronthebeatz-ai/thenewculture
  branch: main
  # OAuth token-exchange proxy (Cloudflare Worker) cho nút "Sign In with
  # GitHub" — xem workers/cms-auth/README.md để deploy và lấy URL thật.
  # "Sign In Using Access Token" (PAT) vẫn hoạt động độc lập, không phụ
  # thuộc giá trị này.
  base_url: https://tnc-cms-auth.PLACEHOLDER.workers.dev

# Nơi lưu ảnh tải lên qua CMS
media_folder: "public/uploads"    # ảnh lưu vật lý ở đây
public_folder: "/uploads"         # đường dẫn ảnh khi hiển thị trên web

# Ngôn ngữ giao diện CMS
locale: vi

# ============================================================
# COLLECTIONS — các "loại nội dung" quản lý được
# ============================================================
collections:
  - name: articles
    label: "Bài viết"
    label_singular: "Bài viết"
    folder: "content/articles"
    create: true                  # cho phép tạo bài mới
    slug: "{{slug}}"              # tên file = slug tự sinh từ tiêu đề
    identifier_field: title
    summary: "{{title}}  ·  {{series}}"
    sortable_fields: [order, date, title]
    icon: article
    fields:
      - label: "Tiêu đề"
        name: title
        widget: string
        hint: "Tiêu đề bài viết, hiển thị lớn ở đầu trang."

      - label: "Series (chuyên mục)"
        name: series
        widget: select
        hint: "Chọn 1 trong 16 tuyến nội dung. Bài sẽ tự xuất hiện trong trang series tương ứng."
        options:
          - { label: "TNC Origins", value: tnc-origins }
          - { label: "TNC Profiles", value: tnc-profiles }
          - { label: "TNC Records", value: tnc-records }
          - { label: "TNC Tracks", value: tnc-tracks }
          - { label: "TNC Breakdown", value: tnc-breakdown }
          - { label: "TNC Editorial", value: tnc-editorial }
          - { label: "TNC Reviews", value: tnc-reviews }
          - { label: "TNC Timeline", value: tnc-timeline }
          - { label: "TNC Culture", value: tnc-culture }
          - { label: "Inside The Culture", value: inside-the-culture }
          - { label: "TNC Community", value: tnc-community }
          - { label: "TNC Radar", value: tnc-radar }
          - { label: "TNC Discovery", value: tnc-discovery }
          - { label: "TNC Music 101", value: tnc-music-101 }
          - { label: "TNC Selects", value: tnc-selects }
          - { label: "Behind The Culture", value: behind-the-culture }

      - label: "Tóm tắt (dek, tùy chọn)"
        name: dek
        widget: text
        required: false
        hint: "Đoạn tóm tắt ngắn hiển thị dưới tiêu đề và trong danh sách bài. Để trống sẽ tự lấy đoạn văn đầu tiên của bài làm tóm tắt."

      - label: "Ảnh bìa"
        name: cover
        widget: image
        required: false
        hint: "Ảnh đại diện bài viết, hiển thị ở trang chủ, trang series và đầu bài. Để trống sẽ dùng nền mặc định."

      - label: "Nguồn ảnh bìa (tùy chọn)"
        name: cover_credit
        widget: string
        required: false
        default: ""
        hint: "Ghi chú nguồn/tác giả ảnh bìa, hiển thị dưới ảnh đầu bài. Để trống sẽ dùng chú thích mặc định 'Ảnh minh họa — TNC Archive'."

      - label: "Ảnh Poster (chỉ dùng cho TNC Community)"
        name: poster
        widget: image
        required: false
        hint: "Chỉ áp dụng khi Series chọn là 'TNC Community'. Khi đã có ảnh này, bài viết sẽ hiển thị dạng poster dọc tại trang danh mục và trang chủ, thay vì thẻ chuẩn. Nên dùng ảnh tỷ lệ dọc (khuyến nghị 2:3, ví dụ 800x1200px) để không bị cắt xén. Bấm vào poster vẫn dẫn tới bài viết đầy đủ như bình thường."

      - label: "Tác giả"
        name: author
        widget: string
        default: "Lamar"

      - label: "Ngày đăng (tùy chọn)"
        name: date
        widget: string
        required: false
        hint: "Để trống sẽ tự động lấy ngày publish. Chỉ điền nếu muốn ghi đè, định dạng: 30 Tháng 6, 2026"
        default: ""

      - label: "Thời gian đọc (tùy chọn)"
        name: read_time
        widget: string
        required: false
        default: ""
        hint: "Để trống sẽ tự động ước tính theo độ dài bài."

      - label: "Bài nổi bật (hero trang chủ)"
        name: featured
        widget: boolean
        default: false
        hint: "Bật nếu muốn bài này làm bài lớn nhất trên trang chủ. Chỉ nên bật 1 bài."

      - label: "Hero Priority"
        name: hero_priority
        widget: boolean
        default: false
        required: false
        hint: "Ưu tiên hiển thị bài này trong Hero trang chủ (luôn có đúng 3 bài). Mặc định, Hero hiển thị 3 bài mới nhất — bật cờ này để ghim bài vào Hero bất kể ngày đăng; các bài Hero Priority luôn hiển thị trước, sắp theo ngày mới nhất, phần còn lại lấp bằng bài mới nhất khác."

      - label: "Thứ tự ưu tiên"
        name: order
        widget: number
        default: 1
        value_type: int
        hint: "Số nhỏ = ưu tiên hiển thị trước (mới hơn). Bài mới nhất nên để số nhỏ như 1, 2, 3."

      - label: "Thẻ (tags)"
        name: tags
        widget: list
        allow_add: true
        default: ["#TNC"]
        hint: "Các từ khóa liên quan, hiển thị cuối bài."

      - label: "Nội dung bài viết"
        name: body
        widget: markdown
        hint: "Viết nội dung tại đây. Dùng ## để tạo tiêu đề phụ, > để tạo trích dẫn, danh sách bắt đầu bằng '1.' hoặc '-' để tạo danh sách có/không số thứ tự. Dán link YouTube, Spotify hoặc SoundCloud đứng riêng một dòng để tự động nhúng trình phát."

      - label: "Bảng xếp hạng (tùy chọn)"
        name: ranking
        widget: list
        required: false
        label_singular: "Ca khúc"
        summary: "{{fields.song}} — {{fields.artist}}"
        hint: "Chỉ dùng cho bài dạng bảng xếp hạng ca khúc. Thêm các mục theo thứ tự #1 trên cùng. Để trống nếu là bài viết thường."
        fields:
          - { label: "Tên ca khúc", name: song, widget: string }
          - { label: "Nghệ sĩ", name: artist, widget: string, required: false }
          - { label: "Ảnh", name: cover, widget: image, required: false, hint: "Ảnh bìa ca khúc. Nếu để trống sẽ tự lấy ảnh từ video YouTube." }
          - { label: "Link YouTube", name: youtube, widget: string, required: false, hint: "Dán link YouTube của ca khúc để nhúng trình phát." }
          - { label: "Bình luận", name: note, widget: text, required: false, hint: "Lý do chọn / phân tích ngắn cho ca khúc này." }

  # ============================================================
  # CẤU HÌNH GIAO DIỆN — logo, khung GIF đầu trang, Spotify
  # Đây là collection dạng "file đơn" — chỉ một bản ghi duy nhất
  # ============================================================
  - name: settings
    label: "Cấu hình giao diện"
    files:
      - name: site
        label: "Trang chủ & Logo"
        file: "content/settings/site.yml"
        fields:
          - label: "Logo (ảnh)"
            name: logo_image
            widget: image
            required: false
            hint: "Tải ảnh logo lên để thay cho chữ 'THE NEW CULTURE' mặc định. Nên dùng ảnh nền trong suốt (PNG), cao khoảng 80-120px. Để trống sẽ dùng logo chữ mặc định."

          - label: "Khung GIF đầu trang chủ"
            name: hero_gif
            widget: image
            required: false
            hint: "Ảnh GIF động, hiển thị to ở đầu trang chủ, tự chạy liên tục. Để trống sẽ ẩn khối này."

          - label: "Tên bài hát (hiện trong khung GIF)"
            name: hero_gif_song_title
            widget: string
            required: false

          - label: "Nghệ sĩ (hiện trong khung GIF)"
            name: hero_gif_song_artist
            widget: string
            required: false

          - label: "Link nhúng Spotify"
            name: spotify_embed_url
            widget: string
            required: false
            hint: "Vào Spotify, chọn Share -> Embed track/playlist -> copy link trong thuộc tính src của đoạn mã, dán vào đây. Ví dụ dạng: https://open.spotify.com/embed/track/xxxxx . Để trống sẽ ẩn khối này. Khối này độc lập, không liên quan tới khung GIF phía trên."

          - label: "Link Facebook"
            name: social_facebook
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Dán đầy đủ đường dẫn trang Facebook của TNC. Nút 'Theo dõi' ở đầu trang sẽ tự động dẫn tới đây. Để trống sẽ ẩn biểu tượng Facebook ở chân trang."

          - label: "Link Instagram"
            name: social_instagram
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Để trống sẽ ẩn biểu tượng Instagram ở chân trang."

          - label: "Link YouTube"
            name: social_youtube
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Để trống sẽ ẩn biểu tượng YouTube ở chân trang."

          - label: "Link TikTok"
            name: social_tiktok
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Để trống sẽ ẩn biểu tượng TikTok ở chân trang."

          - label: "Ảnh/GIF nền khung header"
            name: header_bg_image
            widget: image
            required: false
            hint: "Ảnh hoặc GIF động hiển thị làm nền cho khung chứa logo và nút Theo dõi. Chấp nhận định dạng .jpg, .png, .gif. Để trống sẽ giữ nền trắng mặc định."

          - label: "Quảng cáo trái — Ảnh/Clip dọc"
            name: ad_left_vertical
            widget: file
            required: false
            hint: "Dùng cho khối quảng cáo bên trái trang bài viết (chỉ hiện trên màn hình rộng). Nhận ảnh (.jpg, .png) hoặc video ngắn (.mp4 — sẽ tự động phát lặp lại liên tục, không có nút điều khiển). Khuyến nghị tỷ lệ dọc 9:16."

          - label: "Quảng cáo trái — Ảnh/Clip ngang"
            name: ad_left_horizontal
            widget: file
            required: false
            hint: "Dùng cho trang chủ và mọi thiết bị di động, đồng thời là phương án thay thế cho vị trí bên trái nếu chưa có ảnh dọc. Khuyến nghị tỷ lệ ngang 16:9."

          - label: "Quảng cáo trái — Link đính kèm"
            name: ad_left_link
            widget: string
            required: false
            hint: "Để trống nếu chỉ muốn hiển thị hình/clip, không cho bấm vào. Nếu điền, cả khối quảng cáo trái sẽ dẫn tới đường dẫn này khi bấm."

          - label: "Quảng cáo phải — Ảnh/Clip dọc"
            name: ad_right_vertical
            widget: file
            required: false
            hint: "Dùng cho khối quảng cáo bên phải trang bài viết (chỉ hiện trên màn hình rộng). Nhận ảnh (.jpg, .png) hoặc video ngắn (.mp4 — tự động phát lặp lại liên tục). Khuyến nghị tỷ lệ dọc 9:16."

          - label: "Quảng cáo phải — Ảnh/Clip ngang"
            name: ad_right_horizontal
            widget: file
            required: false
            hint: "Dùng cho trang chủ và mọi thiết bị di động, đồng thời là phương án thay thế cho vị trí bên phải nếu chưa có ảnh dọc. Khuyến nghị tỷ lệ ngang 16:9."

          - label: "Quảng cáo phải — Link đính kèm"
            name: ad_right_link
            widget: string
            required: false
            hint: "Để trống nếu chỉ muốn hiển thị hình/clip, không cho bấm vào. Nếu điền, cả khối quảng cáo phải sẽ dẫn tới đường dẫn này khi bấm."

          - label: "Cloudflare Analytics Token"
            name: cloudflare_analytics_token
            widget: string
            required: false
            hint: "Lấy tại dashboard Cloudflare → Analytics → Web Analytics → Add site → copy 'token' trong đoạn mã. Để trống sẽ không theo dõi lượt truy cập."

  # ============================================================
  # HỒ SƠ BIÊN TẬP VIÊN — mỗi bản ghi tạo 1 trang tác giả riêng
  # LƯU Ý QUAN TRỌNG: trường "Tên" bên dưới phải khớp CHÍNH XÁC
  # (kể cả hoa/thường, khoảng trắng) với trường "Tác giả" đã điền
  # trong các bài viết, nếu không hệ thống sẽ không nối được.
  # ============================================================
  - name: editors
    label: "Biên tập viên"
    label_singular: "Biên tập viên"
    folder: "content/editors"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - label: "Tên"
        name: name
        widget: string
        hint: "Phải khớp chính xác với tên đã điền ở trường 'Tác giả' trong bài viết."

      - label: "Ảnh đại diện"
        name: avatar
        widget: image
        required: false
        hint: "Ảnh chân dung, nên vuông (ví dụ 400x400px) để hiển thị tròn đẹp. Để trống sẽ hiện ô trống mặc định."

      - label: "Giới thiệu"
        name: bio
        widget: text
        required: false
        hint: "Tiểu sử ngắn, hiển thị ở đầu trang hồ sơ tác giả."

      - label: "Vai trò chính"
        name: role_id
        widget: select
        required: false
        default: bien-tap-vien
        hint: "Vai trò chính của biên tập viên trong toà soạn — chỉ chọn 1. Để trống sẽ mặc định hiển thị 'Biên tập viên'."
        options:
          - { label: "Tổng Biên tập", value: tong-bien-tap }
          - { label: "Phó Tổng Biên tập", value: pho-tong-bien-tap }
          - { label: "Thư ký Tòa soạn", value: thu-ky-toa-soan }
          - { label: "Trưởng ban Biên tập", value: truong-ban-bien-tap }
          - { label: "Biên tập viên Cao cấp", value: bien-tap-vien-cao-cap }
          - { label: "Biên tập viên", value: bien-tap-vien }
          - { label: "Thực tập Biên tập", value: thuc-tap-bien-tap }
          - { label: "Biên tập viên Âm nhạc", value: bien-tap-vien-am-nhac }
          - { label: "Biên tập viên Văn hóa", value: bien-tap-vien-van-hoa }
          - { label: "Biên tập viên Tin tức", value: bien-tap-vien-tin-tuc }
          - { label: "Biên tập viên Đánh giá", value: bien-tap-vien-danh-gia }
          - { label: "Biên tập viên Phỏng vấn", value: bien-tap-vien-phong-van }
          - { label: "Biên tập viên Nghiên cứu", value: bien-tap-vien-nghien-cuu }
          - { label: "Giám đốc Sáng tạo", value: giam-doc-sang-tao }
          - { label: "Biên tập viên Hình ảnh", value: bien-tap-vien-hinh-anh }
          - { label: "Cộng tác viên", value: cong-tac-vien }

      - label: "Vinh danh (Honors)"
        name: honor_ids
        widget: select
        multiple: true
        required: false
        hint: "Vinh danh đặc biệt — hiển thị phía TRÊN huy hiệu thường trên trang hồ sơ. Chỉ chọn ID có sẵn; nhãn/màu/hiệu ứng do hệ thống tự quyết định, không nhập tay."
        options:
          - { label: "Người Sáng lập", value: nguoi-sang-lap }
          - { label: "10 Năm Cống hiến", value: "10-nam-cong-hien" }

      - label: "Huy hiệu (Badges)"
        name: badge_ids
        widget: select
        multiple: true
        required: false
        hint: "Huy hiệu đã đạt được, theo 5 nhóm: Sáng lập / Chuyên môn / Báo chí / Nội dung / Cộng đồng. Chỉ chọn ID có sẵn; nhãn/màu/hiệu ứng do hệ thống tự quyết định, không nhập tay."
        options:
          - { label: "Người Đồng sáng lập (Sáng lập)", value: nguoi-dong-sang-lap }
          - { label: "Kiến trúc Nền tảng (Sáng lập)", value: kien-truc-nen-tang }
          - { label: "Chuyên gia Hip-Hop (Chuyên môn)", value: chuyen-gia-hip-hop }
          - { label: "Chuyên gia Văn hóa (Chuyên môn)", value: chuyen-gia-van-hoa }
          - { label: "Đạo đức Báo chí (Báo chí)", value: dao-duc-bao-chi }
          - { label: "Điều tra Chuyên sâu (Báo chí)", value: dieu-tra-chuyen-sau }
          - { label: "Cây bút Nổi bật (Nội dung)", value: cay-but-noi-bat }
          - { label: "Sản xuất Bền vững (Nội dung)", value: san-xuat-ben-vung }
          - { label: "Người Kết nối (Cộng đồng)", value: nguoi-ket-noi }
          - { label: "Đại sứ Cộng đồng (Cộng đồng)", value: dai-su-cong-dong }

  # ============================================================
  # TIẾP THỊ — Chiến dịch quảng bá (banner/video toàn site)
  # Sveltia CMS không hỗ trợ nhóm lồng nhau có tiêu đề riêng trong sidebar
  # (chỉ hỗ trợ divider dạng đường kẻ phân cách, không có chữ) — dùng
  # divider bên dưới để tách khu vực này khỏi nội dung biên tập, và đặt
  # tên collection kèm "(Tiếp thị)" để rõ đây thuộc nhóm nào.
  #
  # Mỗi bản ghi là 1 chiến dịch quảng bá độc lập. build.py chỉ lấy đúng
  # MỘT chiến dịch để hiển thị: "Đang hoạt động" = Có, VÀ ngày build nằm
  # trong khoảng Ngày bắt đầu -> Ngày kết thúc (để trống 1 trong 2 = không
  # giới hạn phía đó); nếu nhiều chiến dịch cùng thỏa, chọn "Độ ưu tiên"
  # (số lớn hơn) cao nhất. Không có chiến dịch nào thỏa -> không banner
  # nào được render, không có banner mặc định/hardcode.
  # ============================================================
  - name: promo-divider
    divider: true

  - name: campaigns
    label: "Chiến dịch quảng bá (Tiếp thị)"
    label_singular: "Chiến dịch"
    folder: "content/campaigns"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{placement}}"
    sortable_fields: [priority, start_date, title]
    fields:
      - label: "Tiêu đề"
        name: title
        widget: string
        hint: "Tên nội bộ để phân biệt chiến dịch trong danh sách CMS — không hiển thị công khai trên website."

      - label: "Đang hoạt động"
        name: active
        widget: boolean
        default: false
        hint: "Tắt để dừng chiến dịch ngay lập tức mà không cần xoá dữ liệu."

      - label: "Vị trí hiển thị"
        name: placement
        widget: select
        default: sticky_bottom
        options:
          - { label: "Sticky Bottom (dính đáy trang, mọi trang)", value: sticky_bottom }
        hint: "Vị trí banner sẽ xuất hiện trên website."

      - label: "Loại"
        name: type
        widget: select
        default: image
        options:
          - { label: "Ảnh", value: image }
          - { label: "Video", value: video }
        hint: "Chọn 'Ảnh' để dùng Banner Desktop/Banner Mobile bên dưới. Chọn 'Video' để dùng trường Video."

      - label: "Banner Desktop"
        name: desktop_image
        widget: image
        required: false
        hint: "Dùng khi Loại = Ảnh, hiển thị trên màn hình rộng. Cũng được dùng làm ảnh chờ (poster) khi Loại = Video, để tránh khung trống lúc video chưa tải xong. Khuyến nghị ảnh ngang, thấp (ví dụ 1200x120px)."

      - label: "Banner Mobile"
        name: mobile_image
        widget: image
        required: false
        hint: "Dùng khi Loại = Ảnh, hiển thị trên màn hình hẹp (điện thoại). Để trống sẽ tự dùng Banner Desktop cho mọi kích thước màn hình."

      - label: "Video"
        name: video
        widget: file
        required: false
        accept: "video/*"
        hint: "Dùng khi Loại = Video. Tự động phát, tắt tiếng, lặp lại liên tục, không có nút điều khiển (giống khối quảng cáo hông trang hiện có)."

      - label: "Liên kết"
        name: destination_url
        widget: string
        required: false
        hint: "Bấm vào bất kỳ đâu trên banner sẽ mở đường dẫn này. Để trống banner sẽ hiển thị nhưng không bấm được."

      - label: "Mở tab mới"
        name: open_in_new_tab
        widget: boolean
        default: true
        hint: "Bật = mở Liên kết ở tab mới. Tắt = mở ngay trên tab hiện tại."

      - label: "Ngày bắt đầu"
        name: start_date
        widget: datetime
        type: date
        format: "YYYY-MM-DD"
        required: false
        hint: "Để trống = chạy ngay khi Đang hoạt động = Có, không chờ tới ngày nào cả."

      - label: "Ngày kết thúc"
        name: end_date
        widget: datetime
        type: date
        format: "YYYY-MM-DD"
        required: false
        hint: "Để trống = chạy vô thời hạn cho tới khi tự tay tắt Đang hoạt động."

      - label: "Cho phép đóng"
        name: dismissible
        widget: boolean
        default: true
        hint: "Bật để hiện nút X cho phép người xem tự đóng banner."

      - label: "Hiện lại sau (ngày)"
        name: dismiss_days
        widget: number
        value_type: int
        default: 7
        min: 0
        required: false
        hint: "Số ngày ẩn banner sau khi người xem bấm đóng, hết số ngày này sẽ tự hiện lại. Chỉ có tác dụng khi 'Cho phép đóng' = Có."

      - label: "Độ ưu tiên"
        name: priority
        widget: number
        value_type: int
        default: 1
        hint: "Nếu nhiều chiến dịch cùng đang hoạt động và cùng trong thời gian chạy, chỉ chiến dịch có số Độ ưu tiên LỚN NHẤT được hiển thị. Các chiến dịch còn lại tự động ẩn cho tới khi chiến dịch ưu tiên cao hơn kết thúc."

  # ============================================================
  # HỒ SƠ NHÂN VẬT/ĐƠN VỊ (TNC Profiles — "thẻ tướng")
  # Nhấn vào series TNC Profiles trên web sẽ hiện lưới thẻ bài từ đây.
  # ============================================================
  - name: profiles
    label: "Hồ sơ TNC Profiles"
    label_singular: "Hồ sơ"
    folder: "content/profiles"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} — {{type}}"
    fields:
      - label: "Tên"
        name: name
        widget: string
        hint: "Tên nghệ sĩ, hoặc tên đơn vị (label, studio...)."

      - label: "Tên gọi khác (aliases)"
        name: aliases
        widget: list
        allow_add: true
        required: false
        default: []
        hint: "Các cách viết/gọi khác của cùng một người: nghệ danh viết hoa toàn bộ, tên thật, biệt danh... Ví dụ: WOWY, Wowy, Nguyễn Ngọc Minh Huy. Dùng để: (1) gộp đúng bài viết có tag khớp bất kỳ tên nào trong số này vào mục 'Bài viết liên quan', (2) tự nhận diện và gắn link tới hồ sơ này mỗi khi tên xuất hiện trong bài viết khác. Không cần nhập lại tên chính ở trường 'Tên' phía trên."

      - label: "Loại"
        name: type
        widget: select
        options:
          - { label: "Nghệ sĩ", value: "nghe-si" }
          - { label: "Producer", value: "producer" }
          - { label: "Label", value: "label" }
          - { label: "Studio", value: "studio" }
          - { label: "Quản lý & Booking", value: "quan-ly" }
          - { label: "Nhà sáng tạo khác", value: "khac" }
        hint: "Hiển thị dưới dạng nhãn màu trên thẻ bài."

      - label: "Vai trò / Chức danh"
        name: role
        widget: string
        hint: "Ví dụ: Rapper, Producer, Label độc lập, Quản lý nghệ sĩ..."

      - label: "Độ ảnh hưởng"
        name: influence
        widget: number
        value_type: int
        min: 0
        max: 100
        default: 50
        hint: "Thang điểm 0-100, hiển thị dạng thanh chỉ số trên thẻ bài, giống chỉ số sức mạnh trong thẻ tướng."

      - label: "Badge thành tích"
        name: badges
        widget: select
        multiple: true
        required: false
        options:
          - { label: "GOAT — Đỉnh cao mọi thời đại", value: "goat" }
          - { label: "HOT — Đang thịnh hành, sôi nổi", value: "hot" }
          - { label: "RISING — Đang trên đà tăng trưởng", value: "rising" }
          - { label: "TALENT — Gương mặt mới tiềm năng", value: "talent" }
          - { label: "VERIFIED — Đã xác thực chính chủ", value: "verified" }
          - { label: "VETERAN — Kỳ cựu, thâm niên lâu năm", value: "veteran" }
          - { label: "UNDERRATED — Thực lực cao hơn được ghi nhận", value: "underrated" }
        hint: "Chọn thủ công một hoặc nhiều badge phù hợp. GOAT sẽ khiến tên hồ sơ hiện hiệu ứng 'bốc lửa' kèm badge đỏ phát sáng cạnh tên; các badge khác hiển thị xếp chồng bên dưới vai trò."

      - label: "Ảnh đại diện"
        name: avatar
        widget: image
        required: false
        hint: "Ảnh hiển thị trên thẻ bài và đầu trang chi tiết. Nên dùng ảnh tỷ lệ dọc (ví dụ 3:4) để khớp khung thẻ."

      - label: "Mô tả ngắn"
        name: short_desc
        widget: text
        required: false
        hint: "Một câu mô tả ngắn, dùng cho việc chia sẻ mạng xã hội khi dán link trang hồ sơ này."

      - label: "Nội dung chi tiết"
        name: body
        widget: markdown
        required: false
        hint: "Tiểu sử, dấu ấn nổi bật, thông tin chi tiết — hiển thị đầy đủ ở trang riêng của hồ sơ này."

      - label: "Spotify Artist URL"
        name: spotify_artist
        widget: string
        required: false
        default: ""
        hint: "Dán link trang nghệ sĩ trên Spotify (https://open.spotify.com/artist/xxxxxxxxxxxxxxxx) để nhúng trình phát Spotify Artist ở cuối trang hồ sơ. Để trống nếu không cần."

  # ============================================================
  # TNC MAGAZINE — Monthly Digital Magazine
  # QUAN TRỌNG: collection này KHÔNG chứa bài viết, KHÔNG có field chọn
  # danh sách bài. Mỗi bản ghi chỉ là METADATA của một số báo THEO THÁNG
  # (ảnh bìa, Cover Story, lời toà soạn, tháng/năm, trạng thái). Lúc build,
  # hệ thống tự động gộp TOÀN BỘ bài viết có "Ngày đăng" rơi vào đúng
  # Tháng/Năm bên dưới vào đúng số báo đó — không nhập tay, không tạo bản
  # sao bài viết nào cả. Mỗi tháng chỉ nên có 1 số báo.
  # Issue Number KHÔNG phải trường nhập tay — tự tăng 001, 002, 003... theo
  # thứ tự Tháng/Năm, KHÔNG reset theo năm, tính lại mỗi lần build (xem
  # scripts/magazine.py — Issue Builder, module độc lập với hệ bài viết chính).
  # ============================================================
  - name: magazine-divider
    divider: true

  - name: magazine
    label: "TNC Magazine"
    label_singular: "Số báo"
    folder: "content/magazine"
    create: true
    slug: "{{fields.year}}-{{fields.month}}"
    identifier_field: year
    summary: "Tháng {{fields.month}}/{{fields.year}} — {{fields.status}}"
    sortable_fields: [year, month, status]
    fields:
      - label: "Ảnh bìa"
        name: cover_image
        widget: image
        hint: "Ảnh bìa cho số báo này. Khuyến nghị ảnh dọc hoặc vuông, chất lượng cao — dùng làm bìa Issue, khối Trang chủ và thẻ trong Magazine Archive."

      - label: "Cover Story"
        name: cover_story
        widget: relation
        collection: articles
        search_fields: [title]
        display_fields: ["title"]
        value_field: "{{slug}}"
        required: true
        hint: "Chọn đúng 1 bài viết làm Cover Story của số báo này (nên chọn bài có Ngày đăng trong đúng Tháng/Năm bên dưới). Trang chủ và trang Issue đều sẽ nổi bật bài này."

      - label: "Lời toà soạn (Editor's Note, tùy chọn)"
        name: editors_note
        widget: text
        required: false
        hint: "Đoạn lời dẫn ngắn của toà soạn cho số báo này. Để trống sẽ ẩn phần này trên trang Issue."

      - label: "Tháng"
        name: month
        widget: select
        options:
          - { label: "Tháng 1", value: 1 }
          - { label: "Tháng 2", value: 2 }
          - { label: "Tháng 3", value: 3 }
          - { label: "Tháng 4", value: 4 }
          - { label: "Tháng 5", value: 5 }
          - { label: "Tháng 6", value: 6 }
          - { label: "Tháng 7", value: 7 }
          - { label: "Tháng 8", value: 8 }
          - { label: "Tháng 9", value: 9 }
          - { label: "Tháng 10", value: 10 }
          - { label: "Tháng 11", value: 11 }
          - { label: "Tháng 12", value: 12 }
        hint: "TNC Magazine sẽ TỰ ĐỘNG gộp toàn bộ bài viết có 'Ngày đăng' rơi vào đúng Tháng/Năm này vào số báo — không cần và không thể chọn bài thủ công."

      - label: "Năm"
        name: year
        widget: select
        default: 2026
        options:
          - { label: "2024", value: 2024 }
          - { label: "2025", value: 2025 }
          - { label: "2026", value: 2026 }
          - { label: "2027", value: 2027 }
          - { label: "2028", value: 2028 }
          - { label: "2029", value: 2029 }
          - { label: "2030", value: 2030 }
        hint: "Năm phát hành của số báo. Mỗi Tháng/Năm chỉ nên có đúng 1 số báo."

      - label: "Trạng thái"
        name: status
        widget: select
        default: draft
        options:
          - { label: "Nháp (chưa công khai)", value: draft }
          - { label: "Đã xuất bản", value: published }
        hint: "Chỉ số báo ở trạng thái 'Đã xuất bản' mới được tính vào Issue Number, hiển thị trên Trang chủ, Magazine Archive và ghi chú 'Published in' ở bài viết."
