<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>TNC — Quản trị nội dung</title>
  <!-- Chỉ rõ đường dẫn tuyệt đối tới config.yml thay vì để Sveltia CMS tự
       suy ra theo URL hiện tại. Nếu trình duyệt vào đúng "/admin" (thiếu
       dấu / cuối — rất dễ xảy ra khi gõ tay URL hoặc mở từ bookmark cũ),
       việc suy luận tương đối sẽ tính nhầm config.yml nằm ở gốc domain
       thay vì trong /admin/, gây lỗi "configuration file could not be
       retrieved". Đường dẫn tuyệt đối loại bỏ hoàn toàn rủi ro này.
       BẮT BUỘC phải có type="application/yaml": thuộc tính DOM "type" của
       thẻ <link> khi thiếu sẽ trả về chuỗi rỗng "" (không phải undefined),
       khiến Sveltia CMS coi định dạng file là "không hỗ trợ" và báo lỗi
       "configuration file could not be parsed" dù nội dung YAML hợp lệ. -->
  <link rel="cms-config-url" href="/admin/config.yml" type="application/yaml">
</head>
<body>
  <!-- Sveltia CMS: nạp từ CDN, luôn lấy bản mới nhất -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- V2.2 Permission Layer: chỉ HIỂN THỊ vai trò biên tập nhận được từ
       Worker sau khi đăng nhập — không can thiệp vào Sveltia CMS, không
       tham gia bắt tay postMessage (Sveltia CMS đã tự làm việc đó), chỉ
       lắng nghe thụ động cùng sự kiện "message" mà popup OAuth phát ra.
       Vai trò không lưu ở đâu cả ngoài biến bộ nhớ của chính trang này —
       mất khi tải lại trang, đúng tinh thần "không cache quyền". -->
  <script>
  (function () {
    function showRoleBadge(role, login) {
      var el = document.createElement("div");
      el.textContent = "Vai trò: " + role + (login ? " (" + login + ")" : "");
      el.style.cssText =
        "position:fixed;bottom:12px;right:12px;z-index:99999;" +
        "background:#0B0B0B;color:#fff;font:600 12px/1.4 -apple-system,sans-serif;" +
        "padding:8px 14px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.3);" +
        "pointer-events:none;";
      document.body.appendChild(el);
    }
    window.addEventListener(
      "message",
      function (e) {
        if (typeof e.data !== "string") return;
        var m = e.data.match(/^authorization:([\w-]+):(success|error):([\s\S]*)$/);
        if (!m || m[2] !== "success") return;
        var payload;
        try {
          payload = JSON.parse(m[3]);
        } catch (_err) {
          return;
        }
        if (payload && payload.role) showRoleBadge(payload.role, payload.login);
      },
      false
    );
  })();
  </script>
</body>
</html>
