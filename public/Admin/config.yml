# ============================================================
# CẤU HÌNH SVELTIA CMS — The New Culture
# ============================================================

backend:
  name: github
  repo: lamaronthebeatz-ai/thenewculture
  branch: main

# Nơi lưu ảnh tải lên qua CMS
media_folder: "public/uploads"    # ảnh lưu vật lý ở đây
public_folder: "/uploads"         # đường dẫn ảnh khi hiển thị trên web

# Ngôn ngữ giao diện CMS
locale: vi

# ============================================================
# COLLECTIONS — các "loại nội dung" quản lý được
# ============================================================
collections:
  - name: articles
    label: "Bài viết"
    label_singular: "Bài viết"
    folder: "content/articles"
    create: true                  # cho phép tạo bài mới
    slug: "{{slug}}"              # tên file = slug tự sinh từ tiêu đề
    identifier_field: title
    summary: "{{title}}  ·  {{series}}"
    sortable_fields: [order, date, title]
    icon: article
    fields:
      - label: "Tiêu đề"
        name: title
        widget: string
        hint: "Tiêu đề bài viết, hiển thị lớn ở đầu trang."

      - label: "Series (chuyên mục)"
        name: series
        widget: select
        hint: "Chọn 1 trong 16 tuyến nội dung. Bài sẽ tự xuất hiện trong trang series tương ứng."
        options:
          - { label: "TNC Origins", value: tnc-origins }
          - { label: "TNC Profiles", value: tnc-profiles }
          - { label: "TNC Records", value: tnc-records }
          - { label: "TNC Tracks", value: tnc-tracks }
          - { label: "TNC Breakdown", value: tnc-breakdown }
          - { label: "TNC Editorial", value: tnc-editorial }
          - { label: "TNC Reviews", value: tnc-reviews }
          - { label: "TNC Timeline", value: tnc-timeline }
          - { label: "TNC Culture", value: tnc-culture }
          - { label: "Inside The Culture", value: inside-the-culture }
          - { label: "TNC Community", value: tnc-community }
          - { label: "TNC Radar", value: tnc-radar }
          - { label: "TNC Discovery", value: tnc-discovery }
          - { label: "TNC Music 101", value: tnc-music-101 }
          - { label: "TNC Selects", value: tnc-selects }
          - { label: "Behind The Culture", value: behind-the-culture }

      - label: "Tóm tắt (dek)"
        name: dek
        widget: text
        hint: "Đoạn tóm tắt ngắn hiển thị dưới tiêu đề và trong danh sách bài."

      - label: "Ảnh bìa"
        name: cover
        widget: image
        required: false
        hint: "Ảnh đại diện bài viết, hiển thị ở trang chủ, trang series và đầu bài. Để trống sẽ dùng nền mặc định."

      - label: "Tác giả"
        name: author
        widget: string
        default: "TNC Editorial"

      - label: "Ngày đăng (tùy chọn)"
        name: date
        widget: string
        required: false
        hint: "Để trống sẽ tự động lấy ngày publish. Chỉ điền nếu muốn ghi đè, định dạng: 30 Tháng 6, 2026"
        default: ""

      - label: "Thời gian đọc (tùy chọn)"
        name: read_time
        widget: string
        required: false
        default: ""
        hint: "Để trống sẽ tự động ước tính theo độ dài bài."

      - label: "Bài nổi bật (hero trang chủ)"
        name: featured
        widget: boolean
        default: false
        hint: "Bật nếu muốn bài này làm bài lớn nhất trên trang chủ. Chỉ nên bật 1 bài."

      - label: "Thứ tự ưu tiên"
        name: order
        widget: number
        default: 10
        value_type: int
        hint: "Số nhỏ = ưu tiên hiển thị trước (mới hơn). Bài mới nhất nên để số nhỏ như 1, 2, 3."

      - label: "Thẻ (tags)"
        name: tags
        widget: list
        allow_add: true
        hint: "Các từ khóa liên quan, hiển thị cuối bài."

      - label: "Nội dung bài viết"
        name: body
        widget: markdown
        hint: "Viết nội dung tại đây. Dùng ## để tạo tiêu đề phụ, > để tạo trích dẫn."

      - label: "Bảng xếp hạng (tùy chọn)"
        name: ranking
        widget: list
        required: false
        label_singular: "Ca khúc"
        summary: "{{fields.song}} — {{fields.artist}}"
        hint: "Chỉ dùng cho bài dạng bảng xếp hạng ca khúc. Thêm các mục theo thứ tự #1 trên cùng. Để trống nếu là bài viết thường."
        fields:
          - { label: "Tên ca khúc", name: song, widget: string }
          - { label: "Nghệ sĩ", name: artist, widget: string, required: false }
          - { label: "Ảnh", name: cover, widget: image, required: false, hint: "Ảnh bìa ca khúc. Nếu để trống sẽ tự lấy ảnh từ video YouTube." }
          - { label: "Link YouTube", name: youtube, widget: string, required: false, hint: "Dán link YouTube của ca khúc để nhúng trình phát." }
          - { label: "Bình luận", name: note, widget: text, required: false, hint: "Lý do chọn / phân tích ngắn cho ca khúc này." }

  # ============================================================
  # CẤU HÌNH GIAO DIỆN — logo, khung GIF đầu trang, Spotify
  # Đây là collection dạng "file đơn" — chỉ một bản ghi duy nhất
  # ============================================================
  - name: settings
    label: "Cấu hình giao diện"
    files:
      - name: site
        label: "Trang chủ & Logo"
        file: "content/settings/site.yml"
        fields:
          - label: "Logo (ảnh)"
            name: logo_image
            widget: image
            required: false
            hint: "Tải ảnh logo lên để thay cho chữ 'THE NEW CULTURE' mặc định. Nên dùng ảnh nền trong suốt (PNG), cao khoảng 80-120px. Để trống sẽ dùng logo chữ mặc định."

          - label: "Khung GIF đầu trang chủ"
            name: hero_gif
            widget: image
            required: false
            hint: "Ảnh GIF động, hiển thị to ở đầu trang chủ, tự chạy liên tục. Để trống sẽ ẩn khối này."

          - label: "Tên bài hát (hiện trong khung GIF)"
            name: hero_gif_song_title
            widget: string
            required: false

          - label: "Nghệ sĩ (hiện trong khung GIF)"
            name: hero_gif_song_artist
            widget: string
            required: false

          - label: "Link nhúng Spotify"
            name: spotify_embed_url
            widget: string
            required: false
            hint: "Vào Spotify, chọn Share -> Embed track/playlist -> copy link trong thuộc tính src của đoạn mã, dán vào đây. Ví dụ dạng: https://open.spotify.com/embed/track/xxxxx . Để trống sẽ ẩn khối này. Khối này độc lập, không liên quan tới khung GIF phía trên."

          - label: "Link Facebook"
            name: social_facebook
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Dán đầy đủ đường dẫn trang Facebook của TNC. Nút 'Theo dõi' ở đầu trang sẽ tự động dẫn tới đây. Để trống sẽ ẩn biểu tượng Facebook ở chân trang."

          - label: "Link Instagram"
            name: social_instagram
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Để trống sẽ ẩn biểu tượng Instagram ở chân trang."

          - label: "Link YouTube"
            name: social_youtube
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Để trống sẽ ẩn biểu tượng YouTube ở chân trang."

          - label: "Link TikTok"
            name: social_tiktok
            widget: string
            required: false
            pattern: ['^https?://.+', 'Đường dẫn phải bắt đầu bằng http:// hoặc https://']
            hint: "Để trống sẽ ẩn biểu tượng TikTok ở chân trang."

  # ============================================================
  # HỒ SƠ BIÊN TẬP VIÊN — mỗi bản ghi tạo 1 trang tác giả riêng
  # LƯU Ý QUAN TRỌNG: trường "Tên" bên dưới phải khớp CHÍNH XÁC
  # (kể cả hoa/thường, khoảng trắng) với trường "Tác giả" đã điền
  # trong các bài viết, nếu không hệ thống sẽ không nối được.
  # ============================================================
  - name: editors
    label: "Biên tập viên"
    label_singular: "Biên tập viên"
    folder: "content/editors"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - label: "Tên"
        name: name
        widget: string
        hint: "Phải khớp chính xác với tên đã điền ở trường 'Tác giả' trong bài viết."

      - label: "Ảnh đại diện"
        name: avatar
        widget: image
        required: false
        hint: "Ảnh chân dung, nên vuông (ví dụ 400x400px) để hiển thị tròn đẹp. Để trống sẽ hiện ô trống mặc định."

      - label: "Giới thiệu"
        name: bio
        widget: text
        required: false
        hint: "Tiểu sử ngắn, hiển thị ở đầu trang hồ sơ tác giả."
